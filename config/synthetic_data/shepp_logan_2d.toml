[shepp_logan]
# Phantom dimensionality; choose "2D" or "3D" and keep it consistent with Nz_SheppLogan.
data_dimension = "2D"
# Phantom in-plane matrix size (Nx=Ny); use any positive integer.
N_SheppLogan = 128
# Number of synthetic receive coils.
# Use a positive integer divisible by 4.
Ncoils_SheppLogan = 4
# Phantom depth; use a positive integer equal to 1 for "2D" and greater than 1 for "3D".
Nz_SheppLogan = 1
# Fraction of the image occupied by the phantom; use a finite value in (0, 1], where lower values add margins.
SheppLoganFillFraction = 1.0
