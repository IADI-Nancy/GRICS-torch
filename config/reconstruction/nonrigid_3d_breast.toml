[reconstruction]

# Data and motion model
# Reconstruction data dimensionality tag for compatibility checks.
reconstruction_dimension = "3D"
# Motion model used by reconstruction ("rigid" or "non-rigid").
reconstruction_motion_type = "non-rigid"

# Motion-state binning
# Number of reconstruction motion states.
# Per-shot simulation automatically replaces this value with the shot count.
N_motion_states = 16
# Motion-state grouping method: "kmeans" or "kspace_energy".
# "kspace_energy" requires motion_quantization_bins (integer >= 2; e.g. 256).
# For "kmeans", omit motion_quantization_bins; the config loader rejects it.
motion_binning_mode = "kspace_energy"
# Number of uniform quantization levels per physiological channel when
# motion_binning_mode = "kspace_energy". Must be an integer greater than or equal to 2.
# Required only when motion_binning_mode = "kspace_energy"; omit otherwise.
motion_quantization_bins = 256
# GRICS++ exports zero-mean, unit-variance model inputs for this acquisition.
motion_signal_normalization = "acquisition_zscore"

# Multi-resolution reconstruction
# Multi-resolution scale factors: strictly increasing in (0, 1], ending at 1.0.
ResolutionLevels = [0.25, 0.5, 1.0]
# Match GRICS++: 8 virtual times at the coarsest level, then all 16 states.
N_motion_states_per_level = [8, 16, 16]
# Must contain exactly one positive GN iteration count per ResolutionLevels entry.
GN_iterations_per_level = [8, 8, 2]
# false keeps the conventional final GN iteration image-only.
update_motion_on_final_iteration = false
# GRICS++ finishes each resolution with an image update and carries no
# unevaluated motion update into the next level.
image_only_last_iteration_per_level = true
# true stops a resolution level when its image residual increases.
gn_early_stopping = true

# Conjugate-gradient stopping
# GRICS++ stops PCG by tolerance or max iterations, without Torch's additional
# numerical-stagnation countdown.
cg_stop_on_stagnation = false
# Iteration interval for recomputing the true residual in CG.
cg_true_residual_interval = 10
# Consecutive numerically tiny updates required to start the stagnation countdown.
cg_stagnation_consecutive_steps = 12
# Countdown length including the triggering iteration; 0 or 1 stops immediately.
cg_stagnation_countdown_steps = 6

# Regularization scaling
# Estimate regularization scaling internally from probes.
# When true, cg_reg_scale_num_probes is required (positive integer; e.g. 8).
# When false, omit cg_reg_scale_num_probes; the config loader rejects it.
cg_use_reg_scale_proxy = false
# Match GRICS++ adjoint-norm image scaling and physical-spacing motion scaling.
regularization_scaling = "grics_cpp"
# Match the supplied GRICS++ RegularizationMatrix.dat: use the normalized
# calibration magnitude as a multiplicative image prior. In the reference XML,
# useCalibAsPriorImage=false selects the supplied file rather than disabling it.
use_calibration_image_prior = true

# Image update
# Image reconstruction regularization weight.
lambda_r = 1.0
# Maximum CG/GN inner iterations for image update.
max_iter_recon = 10
# Convergence tolerance for image update.
tol_recon = 1.0e-3

# Motion update
# Motion reconstruction regularization weight.
lambda_m = 0.5
# Maximum CG/GN inner iterations for motion update.
max_iter_motion = 15
# Match ModelOptimizerSolver usePreconditioner=true.
use_motion_preconditioner = true
# Convergence tolerance for motion update.
tol_motion = 1.0e-2
