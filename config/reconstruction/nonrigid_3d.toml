[reconstruction]
# Reconstruction data dimensionality tag for compatibility checks.
reconstruction_dimension = "3D"
# Motion model used by reconstruction ("rigid" or "non-rigid").
reconstruction_motion_type = "non-rigid"
# Number of reconstruction motion states.
# Per-shot simulation automatically replaces this value with the shot count.
N_motion_states = 8
# Multi-resolution scale factors: strictly increasing in (0, 1], ending at 1.0.
ResolutionLevels = [0.25, 0.5, 1.0]
# Must contain exactly one positive GN iteration count per ResolutionLevels entry.
GN_iterations_per_level = [10, 4, 4]
# false keeps the conventional final GN iteration image-only.
update_motion_on_final_iteration = false
# true stops a resolution level when its image residual increases.
gn_early_stopping = true
# Save reconstruction tensors, final figures, and logs; diagnostics also require save_debug_plots.
save_reconstruction_outputs = true

# Stop CG when stagnation is detected.
cg_early_stopping = true
# Iteration interval for recomputing the true residual in CG.
cg_true_residual_interval = 10
# Allowed consecutive stagnating CG steps.
cg_max_stag_steps = 12
# Extra CG steps after the first stopping criterion is met.
cg_max_more_steps = 6
# Estimate regularization scaling internally from probes.
cg_use_reg_scale_proxy = true
# Number of probes for regularization scaling estimate.
cg_reg_scale_num_probes = 8

# Image reconstruction regularization weight.
lambda_r = 5.0e-2
# Maximum CG/GN inner iterations for image update.
max_iter_recon = 160
# Convergence tolerance for image update.
tol_recon = 1.0e-4

# Motion reconstruction regularization weight.
lambda_m = 10.0
# Maximum CG/GN inner iterations for motion update.
max_iter_motion = 160
# Convergence tolerance for motion update.
tol_motion = 1.0e-3

# Motion-state grouping method: "kmeans" or "kspace_energy".
motion_binning_mode = "kmeans"
# "full" uses all configured motion states at every resolution level.
# Alternatively, give one positive count per level (reduction requires non-rigid motion).
N_motion_states_per_level = "full"
