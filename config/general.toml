[paths]
# Folder for debug plots and intermediate diagnostics.
debug_folder = "debug_outputs/"
# Folder for optimizer logs and residual curves.
logs_folder = "logs/"
# Folder for final outputs (images, motion model).
results_folder = "results/"
# Folder for saved input data artifacts (ground truth/distorted images, motion signals, etc.).
initial_data_folder = "initial_data/"

[runtime]
# Save diagnostic motion curves/fields, acquisition-order plots, and per-level reconstruction images.
save_debug_plots = true
# Request deterministic PyTorch/cuDNN algorithms; warn when unavailable. Seeding is controlled below.
use_deterministic_algorithms = true
# Preferred compute device: "gpu" or "cpu".
runtime_device = "gpu"
# Enable random seeding independently of deterministic algorithms.
seed_enabled = true
# Random seed used when seed_enabled is true.
seed = 1
# Notebook mode disables verbose/console logging unless explicitly set in overrides.
# Any automatic logging change is printed as an informational message.
jupyter_notebook_flag = false
# Flip displayed images vertically. Set explicitly for acquisition orientation.
flip_for_display = false
# Print inner conjugate-gradient solver diagnostics.
verbose = true
# Print JointReconstructor progress to console.
print_to_console = true
# Clean debug/log/results/initial_data folders before each run.
clean_output_folders_before_run = true


[kspace_normalization]
# Normalize k-space before optimization.
normalize_kspace = true
# Normalization mode: "rms" or "max".
kspace_norm_mode = "rms"
# Lower bound to avoid division by zero during normalization.
kspace_norm_eps = 1.0e-12
