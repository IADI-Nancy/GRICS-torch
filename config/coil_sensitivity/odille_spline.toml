[coil_sensitivity]
# Estimate sensitivity maps with the Odille spline method.
# "odille-spline" requires spline_magnitude_smoothing, spline_phase_smoothing and coil_sensitivity_eps.
# Omit espirit_calibration_width, espirit_kernel_width and espirit_max_iter.
# Switch the whole coil-sensitivity config when changing methods.
coil_sensitivity_method = "odille-spline"
# Smoothing weight for coil-magnitude maps.
spline_magnitude_smoothing = 1000.0
# Smoothing weight for coil-phase maps.
spline_phase_smoothing = 1000.0
# Positive lower bound for reference-image normalization.
coil_sensitivity_eps = 1.0e-8
