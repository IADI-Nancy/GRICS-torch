[sampling]
# Sampling order model used by simulated acquisition.
# Simulated sampling requires NshotsPerNex, Nex, acceleration_factor and calibration_lines.
kspace_sampling_type = "random"
# Number of shots per average (Nex). Higher means more motion states for shot-wise simulations.
NshotsPerNex = 4
# Number of averages/repetitions acquired.
Nex = 1
# Values greater than 1 require calibration_lines > 0.
acceleration_factor = 1
# Required even without acceleration; zero is allowed only when acceleration_factor = 1.
calibration_lines = 24
