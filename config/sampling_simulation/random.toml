[sampling]
# Sampling order model; choose "linear", "interleaved", or "random" for simulation, or "from-data" for real recorded order.
# Simulated sampling requires NshotsPerNex, Nex, acceleration_factor and calibration_lines.
kspace_sampling_type = "random"
# Number of shots per repetition; use a positive integer no greater than the acquired readouts per repetition.
NshotsPerNex = 4
# Number of simulated averages/repetitions; use any positive integer.
Nex = 1
# Regular phase-encoding acceleration factor; use a positive integer, with values > 1 requiring calibration_lines > 0.
acceleration_factor = 1
# Central calibration-band width in ky lines; use an integer from 0 through Ny, with 0 allowed only at acceleration 1.
calibration_lines = 24
