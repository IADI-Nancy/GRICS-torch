[sampling]
# Preserve the acquisition order and repetition counts recorded in real input data.
# Loaded automatically for real data when no simulated sampling is selected.
# Requires real input data; omit NshotsPerNex, Nex, acceleration_factor and calibration_lines.
# The loader rejects these simulated-sampling parameters for "from-data".
kspace_sampling_type = "from-data"
