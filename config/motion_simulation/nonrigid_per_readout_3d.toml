[motion]
# Import shared motion parameters; use one nonempty relative TOML path below this file's directory.
include = "common/nonrigid_common.toml"
# Required data dimensionality; choose "2D" or "3D" and match the input data.
motion_simulation_config_dimension = "3D"
# Synthetic motion mode; choose "rigid-per-readout", "rigid-per-shot", "non-rigid-per-readout", or "non-rigid-per-shot"; real recorded motion uses "as-it-is".
# This file selects continuous non-rigid respiratory motion over the acquisition.
# Requires motion_simulation_config_dimension matching the input data and the
# shared parameters supplied by include above; change the included file when changing models.
# Additionally requires nonrigid_motion_amplitude, nonrigid_resp_cycles_min and
# nonrigid_resp_cycles_max; omit nonrigid_discrete_s_scale.
simulated_motion_type = "non-rigid-per-readout"
# Global scale for synthetic non-rigid displacement fields; use any finite value >= 0.
nonrigid_motion_amplitude = 2.0
# Minimum respiratory cycles over the full acquisition; use a finite value >= 0 and no greater than the maximum.
nonrigid_resp_cycles_min = 6
# Maximum respiratory cycles over the full acquisition; use a finite value >= the minimum.
nonrigid_resp_cycles_max = 7
