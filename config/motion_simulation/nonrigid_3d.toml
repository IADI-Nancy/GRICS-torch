[motion]
include = "common/nonrigid_common.toml"
# Dimensionality required by this motion simulation file.
motion_simulation_config_dimension = "3D"
# Continuous respiratory motion over the acquisition.
simulated_motion_type = "non-rigid-realistic"
# Run the simulated non-rigid reconstruction consistency check.
check_simulated_motion_consistency = true
# Global scale for synthetic non-rigid displacement fields.
nonrigid_motion_amplitude = 2.0
# Inclusive range of random respiratory cycles over the full acquisition.
nonrigid_resp_cycles_min = 6
nonrigid_resp_cycles_max = 7
