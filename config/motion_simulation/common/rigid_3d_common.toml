[motion]
# In-plane field of view for translation and center conversion; use any finite value > 0 mm.
FoVxy_mm = 220.0
# Through-plane field of view for z translation and center conversion; use any finite value > 0 mm.
FoVz_mm = 160.0
# Shared 3D rigid-motion limits from Topolnjak et al., doi: 10.1117/12.3006633.
# Global rigid-motion amplitude scale; use any finite value >= 0, where 0 disables motion and 1 uses listed limits.
rigid_motion_amplitude_scale = 2.0
# Maximum absolute x-translation; use any finite value >= 0 mm, converted using FoVxy_mm.
max_tx_3d = 0.165
# Maximum absolute y-translation; use any finite value >= 0 mm, converted using FoVxy_mm.
max_ty_3d = 1.867
# Maximum absolute z-translation; use any finite value >= 0 mm, converted using FoVz_mm.
max_tz_3d = 0.347
# Maximum absolute x-axis rotation; use any finite value >= 0 degrees.
max_rx_3d = 0.219
# Maximum absolute y-axis rotation; use any finite value >= 0 degrees.
max_ry_3d = 0.378
# Maximum absolute z-axis rotation; use any finite value >= 0 degrees.
max_rz_3d = 0.190
# Fixed x-offset of the rotation center from volume center; use any finite signed value in mm.
max_center_x_3d = 0.0
# Fixed y-offset of the rotation center from volume center; use any finite signed value in mm.
max_center_y_3d = -10.0
# Fixed z-offset of the rotation center from volume center; use any finite signed value in mm.
max_center_z_3d = -25.0
