[motion]
# Shared spatial envelope for all synthetic non-rigid motion modes.
# Inferior activation center in normalized SI coordinates [-1, 1].
nonrigid_diaphragm_level = 0.2
# Steepness of the inferior activation transition.
nonrigid_diaphragm_sharpness = 10.0
# Lateral spread of the respiratory envelope along the left-right axis.
nonrigid_lateral_sigma_lr = 0.45
# Lateral spread of the respiratory envelope along the anterior-posterior axis.
nonrigid_lateral_sigma_ap = 0.30
# Relative left-right displacement strength compared with SI displacement.
nonrigid_lr_fraction = 0.15
# Relative anterior-posterior displacement strength compared with SI displacement.
nonrigid_ap_fraction = 0.35
# Anterior bias for supine imaging: 0 is symmetric and 1 is fully anterior.
nonrigid_anterior_bias = 0.7
# Extra SI displacement gain in the most inferior region.
nonrigid_inferior_gain = 0.0
# Attenuation toward the superior region; larger values give stronger decay.
nonrigid_top_decay = 1.0
