[motion]
include = "common/rigid_2d_common.toml"
# Dimensionality required by this motion simulation file.
motion_simulation_config_dimension = "2D"
# Smooth rigid-motion events over the acquisition.
simulated_motion_type = "rigid-realistic"
# Number of smooth motion events across the acquisition.
num_motion_events = 4
# Transition duration in lines for each motion event; larger values are slower.
motion_tau = 2
